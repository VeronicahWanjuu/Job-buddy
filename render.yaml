services:
  # Backend Service
  - type: web
    name: jobbuddy-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: qtCBHKU5r9fCu_ELZzTweUcm_SE07ThXTmpvGIHseg8
      - key: JWT_SECRET_KEY
        value: HKL_iwPAEWn2mMzHpMMgbDKcQFOMxApg6pU8Fw1aW8w
      - key: DATABASE_URL
        value: backend/jobbuddy.db
      - key: UPLOAD_FOLDER
        value: backend/uploads/cvs
      - key: MAX_FILE_SIZE_MB
        value: 5
      - key: ATS_SCORE_THRESHOLD
        value: 60
      - key: PYTHON_VERSION
        value: 3.12.10

  # Frontend Service
  - type: web
    name: jobbuddy-frontend
    runtime: node
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NODE_VERSION
        value: 18